        run: |
          mkdir -p /tmp/rpki-cache
          tar -xf /tmp/rpki-cache.tar -C /tmp/rpki-cache

      - name: Run 22_5_check_invalid_data_rejection.sh
        run: |
          docker run --rm \
            -v /tmp/rpki-cache/routinator-rsync-cache:/opt/routinator-tests/routinator-rsync-cache \
            -v /tmp/rpki-cache/routinator-rsync-out:/opt/routinator-tests/routinator-rsync-out \
            -v /tmp/rpki-cache/routinator-rrdp-out:/opt/routinator-tests/routinator-rrdp-out \
            routinator-test \
            bash "/opt/routinator-tests/22_5_check_invalid_data_rejection.sh"

  # ── 31_1 ──
  test-31-1:
    needs: test-22-5
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Download RPKI cache
        uses: actions/download-artifact@v4
        with:
          name: rpki-cache
          path: /tmp

      - name: Extract RPKI cache
        run: |
          mkdir -p /tmp/rpki-cache
          tar -xf /tmp/rpki-cache.tar -C /tmp/rpki-cache

      - name: Run 31_1_output_csv.sh
        run: |
          docker run --name csv-run \
            -v /tmp/rpki-cache/routinator-rsync-cache:/opt/routinator-tests/routinator-rsync-cache \
            routinator-test \
            bash "/opt/routinator-tests/31_1_output_csv.sh"

      - name: Extract CSV from container
        run: |
          mkdir -p /tmp/rpki-csv
          docker cp csv-run:/opt/routinator-tests/routinator-csv-out /tmp/rpki-csv/
          docker rm csv-run

      - name: Upload CSV output
        uses: actions/upload-artifact@v4
        with:
          name: rpki-csv
          path: /tmp/rpki-csv
          retention-days: 1

  # ── 31_2 ──
  test-31-2:
    needs: test-31-1
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Download RPKI cache
        uses: actions/download-artifact@v4
        with:
          name: rpki-cache
          path: /tmp

      - name: Extract RPKI cache
        run: |
          mkdir -p /tmp/rpki-cache
          tar -xf /tmp/rpki-cache.tar -C /tmp/rpki-cache

      - name: Run 31_2_output_json.sh
        run: |
          docker run --rm \
            -v /tmp/rpki-cache/routinator-rsync-cache:/opt/routinator-tests/routinator-rsync-cache \
            -v /tmp/rpki-cache/routinator-rsync-out:/opt/routinator-tests/routinator-rsync-out \
            -v /tmp/rpki-cache/routinator-rrdp-out:/opt/routinator-tests/routinator-rrdp-out \
            routinator-test \
            bash "/opt/routinator-tests/31_2_output_json.sh"

  # ── 31_3 ──
  test-31-3:
    needs: test-31-2
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Download RPKI cache
        uses: actions/download-artifact@v4
        with:
          name: rpki-cache
          path: /tmp

      - name: Extract RPKI cache
        run: |
          mkdir -p /tmp/rpki-cache
          tar -xf /tmp/rpki-cache.tar -C /tmp/rpki-cache

      - name: Run 31_3_output_openbgpd.sh
        run: |
          docker run --rm \
            -v /tmp/rpki-cache/routinator-rsync-cache:/opt/routinator-tests/routinator-rsync-cache \
            -v /tmp/rpki-cache/routinator-rsync-out:/opt/routinator-tests/routinator-rsync-out \
            -v /tmp/rpki-cache/routinator-rrdp-out:/opt/routinator-tests/routinator-rrdp-out \
            routinator-test \
            bash "/opt/routinator-tests/31_3_output_openbgpd.sh"

  # ── 32_1 ──
  test-32-1:
    needs: test-31-3
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Download CSV output
        uses: actions/download-artifact@v4
        with:
          name: rpki-csv
          path: /tmp/rpki-csv

      - name: Run 32_1_check_prefix.sh
        run: |
          docker run --rm \
            -v /tmp/rpki-csv/routinator-csv-out:/opt/routinator-tests/routinator-csv-out \
            routinator-test \
            bash "/opt/routinator-tests/32_1_check_prefix.sh"

  # ── 32_2 ──
  test-32-2:
    needs: test-32-1
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Download CSV output
        uses: actions/download-artifact@v4
        with:
          name: rpki-csv
          path: /tmp/rpki-csv

      - name: Run 32_2_check_AS.sh
        run: |
          docker run --rm \
            -v /tmp/rpki-csv/routinator-csv-out:/opt/routinator-tests/routinator-csv-out \
            routinator-test \
            bash "/opt/routinator-tests/32_2_check_AS.sh"

  # ── 41_1 ──
  test-41-1:
    needs: test-32-2
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Run 41_1_rtr_server_running.sh
        run: docker run --rm routinator-test bash "/opt/routinator-tests/41_1_rtr_server_running.sh"

  # ── 41_2 ──
  test-41-2:
    needs: test-41-1
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Run 41_2_rtr_port_listen.sh
        run: docker run --rm routinator-test bash "/opt/routinator-tests/41_2_rtr_port_listen.sh"

  # ── 42_1 ──
  test-42-1:
    needs: test-41-2
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Download RPKI cache
        uses: actions/download-artifact@v4
        with:
          name: rpki-cache
          path: /tmp

      - name: Extract RPKI cache
        run: |
          mkdir -p /tmp/rpki-cache
          tar -xf /tmp/rpki-cache.tar -C /tmp/rpki-cache

      - name: Run 42_1_rtr_client_accept.sh
        run: |
          docker run --rm \
            -v /tmp/rpki-cache/routinator-rsync-cache:/opt/routinator-tests/routinator-rsync-cache \
            -e REPOSITORY_DIR=/opt/routinator-tests/routinator-rsync-cache \
            routinator-test \
            bash -c "
              cd /opt/routinator-tests &&
              bash 42_1_rtr_client_accept.sh
            "

  # ── 42_2 ──
  test-42-2:
    needs: test-42-1
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Download RPKI cache
        uses: actions/download-artifact@v4
        with:
          name: rpki-cache
          path: /tmp

      - name: Extract RPKI cache
        run: |
          mkdir -p /tmp/rpki-cache
          tar -xf /tmp/rpki-cache.tar -C /tmp/rpki-cache

      - name: Run 42_2_rtr_incremental_update.sh
        run: |
          docker run --rm \
            -v /tmp/rpki-cache/routinator-rsync-cache:/opt/routinator-tests/routinator-rsync-cache \
            -e REPOSITORY_DIR=/opt/routinator-tests/routinator-rsync-cache \
            routinator-test \
            bash -c "
              cd /opt/routinator-tests &&
              bash 42_2_rtr_incremental_update.sh
            "

  # ── テスト済みバージョンをキャッシュに保存 ──
  save-version:
    needs: [check-version, test-42-2]
    if: always() && needs.check-version.outputs.should_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Save tested version
        run: |
          mkdir -p /tmp/routinator-tested-version
          echo "${{ needs.check-version.outputs.version }}" \
            > /tmp/routinator-tested-version/version.txt

      - name: Cache tested version
        uses: actions/cache/save@v4
        with:
          path: /tmp/routinator-tested-version
          key: routinator-tested-${{ needs.check-version.outputs.version }}
