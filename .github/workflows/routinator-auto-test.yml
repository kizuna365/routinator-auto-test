name: Routinator Auto-Test (Daily)

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1) Routinator バージョン確認 ──
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_test: ${{ steps.compare.outputs.should_test }}
    steps:
      - name: Add NLnet Labs APT repository
        run: |
          curl -fsSL https://packages.nlnetlabs.nl/aptkey.asc \
            | sudo tee /usr/share/keyrings/nlnetlabs-archive-keyring.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/nlnetlabs-archive-keyring.asc] \
          https://packages.nlnetlabs.nl/linux/ubuntu/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/nlnetlabs.list > /dev/null
          sudo apt-get update

      - name: Get latest Routinator version
        id: get_version
        run: |
          VERSION=$(apt-cache policy routinator | grep Candidate | awk '{print $2}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Latest Routinator version: ${VERSION}"

      - name: Restore cached version
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/routinator-tested-version
          key: routinator-tested-${{ steps.get_version.outputs.version }}

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "should_test=false" >> "$GITHUB_OUTPUT"
            echo "バージョン ${{ steps.get_version.outputs.version }} は既にテスト済みです。スキップします"
          else
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            echo "新しいバージョン ${{ steps.get_version.outputs.version }} を検出しました。テストを実行します"
          fi

  # ── 2) Docker イメージのビルド ──
  build:
    needs: check-version
    if: needs.check-version.outputs.should_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t routinator-test .

      - name: Save Docker image
        run: docker save routinator-test | gzip > /tmp/routinator-test.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/routinator-test.tar.gz
          retention-days: 1

  # ── 11_1 ──
  test-11-1:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Run 11_1_pkg_install_check.sh
        run: docker run --rm routinator-test bash "/opt/routinator-tests/11_1_pkg_install_check.sh"

  # ── 11_2 ──
  test-11-2:
    needs: test-11-1
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Run 11_2_version_check.sh
        run: docker run --rm routinator-test bash "/opt/routinator-tests/11_2_version_check.sh"

  # ── 11_3 ──
  test-11-3:
    needs: test-11-2
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Run 11_3_dependency_check.sh
        run: docker run --rm routinator-test bash "/opt/routinator-tests/11_3_dependency_check.sh"

  # ── 12_1 ──
  test-12-1:
    needs: test-11-3
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Run 12_1_default_check.sh
        run: docker run --rm routinator-test bash "/opt/routinator-tests/12_1_default_check.sh"

  # ── 12_2 ──
  test-12-2:
    needs: test-12-1
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Run 12_2_default_where.sh
        run: docker run --rm routinator-test bash "/opt/routinator-tests/12_2_default_where.sh"

  # ── 12_3 ──
  test-12-3:
    needs: test-12-2
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Run 12_3_custom_check.sh
        run: docker run --rm routinator-test bash "/opt/routinator-tests/12_3_custom_check.sh"

  # ── 21_1 ──
  test-21-1:
    needs: test-12-3
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Run 21_1_fetch_rsync.sh
        run: |
          docker run --name rsync-run routinator-test \
            bash "/opt/routinator-tests/21_1_fetch_rsync.sh"

      - name: Extract rsync data from container
        run: |
          mkdir -p /tmp/rpki-rsync
          docker cp rsync-run:/opt/routinator-tests/routinator-rsync-cache /tmp/rpki-rsync/
          docker cp rsync-run:/opt/routinator-tests/routinator-rsync-out /tmp/rpki-rsync/
          docker rm rsync-run

      - name: Archive rsync data
        run: tar -cf /tmp/rpki-rsync.tar -C /tmp/rpki-rsync .

      - name: Upload rsync data
        uses: actions/upload-artifact@v4
        with:
          name: rpki-rsync
          path: /tmp/rpki-rsync.tar
          retention-days: 1

  # ── 21_2 ──
  test-21-2:
    needs: test-21-1
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Run 21_2_fetch_rrdp.sh
        run: |
          docker run --name rrdp-run routinator-test \
            bash "/opt/routinator-tests/21_2_fetch_rrdp.sh"

      - name: Extract RRDP data from container
        run: |
          mkdir -p /tmp/rpki-rrdp
          docker cp rrdp-run:/opt/routinator-tests/routinator-rrdp-out /tmp/rpki-rrdp/
          docker rm rrdp-run

      - name: Download rsync data
        uses: actions/download-artifact@v4
        with:
          name: rpki-rsync
          path: /tmp

      - name: Create combined RPKI cache
        run: |
          mkdir -p /tmp/rpki-cache
          tar -xf /tmp/rpki-rsync.tar -C /tmp/rpki-cache
          cp -r /tmp/rpki-rrdp/routinator-rrdp-out /tmp/rpki-cache/
          tar -cf /tmp/rpki-cache.tar -C /tmp/rpki-cache .

      - name: Upload RPKI cache
        uses: actions/upload-artifact@v4
        with:
          name: rpki-cache
          path: /tmp/rpki-cache.tar
          retention-days: 1

  # ── 21_3 ──
  test-21-3:
    needs: test-21-2
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Download RPKI cache
        uses: actions/download-artifact@v4
        with:
          name: rpki-cache
          path: /tmp

      - name: Extract RPKI cache
        run: |
          mkdir -p /tmp/rpki-cache
          tar -xf /tmp/rpki-cache.tar -C /tmp/rpki-cache

      - name: Run 21_3_check_all_rir.sh
        run: |
          docker run --rm \
            -v /tmp/rpki-cache/routinator-rsync-cache:/opt/routinator-tests/routinator-rsync-cache \
            -v /tmp/rpki-cache/routinator-rsync-out:/opt/routinator-tests/routinator-rsync-out \
            -v /tmp/rpki-cache/routinator-rrdp-out:/opt/routinator-tests/routinator-rrdp-out \
            routinator-test \
            bash "/opt/routinator-tests/21_3_check_all_rir.sh"

  # ── 21_4 ──
  test-21-4:
    needs: test-21-3
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Run 21_4_timeout_test.sh
        run: docker run --rm routinator-test bash "/opt/routinator-tests/21_4_timeout_test.sh"

  # ── 22_1 ──
  test-22-1:
    needs: test-21-4
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Run 22_1_check_cert_chain_validation.sh
        run: docker run --rm routinator-test bash "/opt/routinator-tests/22_1_check_cert_chain_validation.sh"

  # ── 22_2 ──
  test-22-2:
    needs: test-22-1
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
