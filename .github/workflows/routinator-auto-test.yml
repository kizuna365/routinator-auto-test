      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Download RPKI cache
        uses: actions/download-artifact@v4
        with:
          name: rpki-cache
          path: /tmp

      - name: Extract RPKI cache
        run: |
          mkdir -p /tmp/rpki-cache
          tar -xf /tmp/rpki-cache.tar -C /tmp/rpki-cache

      - name: Run 22_3_check_crl_validation.sh
        run: |
          docker run --rm \
            -v /tmp/rpki-cache/routinator-rsync-cache:/opt/routinator-tests/routinator-rsync-cache \
            -v /tmp/rpki-cache/routinator-rsync-out:/opt/routinator-tests/routinator-rsync-out \
            -v /tmp/rpki-cache/routinator-rrdp-out:/opt/routinator-tests/routinator-rrdp-out \
            routinator-test \
            bash "/opt/routinator-tests/22_3_check_crl_validation.sh"

  # ── 22_4 ──
  test-22-4:
    needs: test-22-3
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Download RPKI cache
        uses: actions/download-artifact@v4
        with:
          name: rpki-cache
          path: /tmp

      - name: Extract RPKI cache
        run: |
          mkdir -p /tmp/rpki-cache
          tar -xf /tmp/rpki-cache.tar -C /tmp/rpki-cache

      - name: Run 22_4_check_manifest_validation.sh
        run: |
          docker run --rm \
            -v /tmp/rpki-cache/routinator-rsync-cache:/opt/routinator-tests/routinator-rsync-cache \
            -v /tmp/rpki-cache/routinator-rsync-out:/opt/routinator-tests/routinator-rsync-out \
            -v /tmp/rpki-cache/routinator-rrdp-out:/opt/routinator-tests/routinator-rrdp-out \
            routinator-test \
            bash "/opt/routinator-tests/22_4_check_manifest_validation.sh"

  # ── 22_5 ──
  test-22-5:
    needs: test-22-4
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/routinator-test.tar.gz

      - name: Download RPKI cache
        uses: actions/download-artifact@v4
        with:
